packages:
  - apps/*
  - packages/*

# pnpm bloque les scripts d'installation par defaut (`allowBuilds` depuis
# pnpm 12, `onlyBuiltDependencies` avant). Seuls ces paquets en ont reellement
# besoin : binaires natifs et hooks Git.
allowBuilds:
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  lefthook: true
  msw: false
  sharp: true
  unrs-resolver: true
  workerd: true

# pnpm 12 refuse par defaut les versions publiees depuis trop peu de temps.
# Ces paquets sont epingles volontairement (tableau des versions de
# docs/progress.md), donc on les exclut de ce delai.
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.10'
  - '@turbo/darwin-arm64@2.11.10'
  - '@turbo/linux-64@2.11.10'
  - '@turbo/linux-arm64@2.11.10'
  - '@turbo/windows-64@2.11.10'
  - '@turbo/windows-arm64@2.11.10'
  - turbo@2.11.10
  - vite@8.3.5
  - i18next@26.5.4
  - '@cloudflare/workers-types@5.20261021.1'

# Catalogue : une seule version de chaque outil pour tout le monorepo. Les
# paquets ecrivent `catalog:` au lieu d'un numero, donc une montee de version
# se fait ici et nulle part ailleurs (docs/05).
#
# Deux versions ne sont pas la derniere publiee, et c'est volontaire :
#   - typescript 6.0.3 : typescript-eslint exige `typescript <6.1.0`
#   - @types/react 19.3.0 : suit React 19.3.1
catalog:
  '@cloudflare/vitest-plugin': 1.4.6
  '@cloudflare/workers-types': 5.20261021.1
  '@commitlint/cli': 21.2.4
  '@commitlint/config-conventional': 21.2.4
  '@commitlint/lint': 21.2.4
  '@commitlint/load': 21.2.4
  '@commitlint/types': 21.2.3
  '@eslint/js': 10.0.1
  '@ladle/react': 5.1.1
  '@playwright/test': 1.64.1
  '@tailwindcss/vite': 4.3.3
  '@tanstack/react-router': 1.170.45
  '@testing-library/react': 16.3.3
  '@types/node': 26.6.5
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.2
  '@vitest/coverage-v8': 5.0.5
  axe-core: 4.14.0
  better-auth: 1.7.12
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  eslint: 10.13.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  fast-check: 4.10.2
  globals: 17.13.0
  hono: 4.13.13
  i18next: 26.5.4
  jsdom: 30.1.3
  prettier: 3.9.10
  react: 19.3.1
  react-dom: 19.3.1
  react-i18next: 17.1.0
  tailwindcss: 4.3.3
  typescript: 6.0.3
  typescript-eslint: 8.72.0
  vite: 8.3.5
  vite-plugin-pwa: 2.0.0
  vitest: 5.0.5
  wrangler: 4.151.3
  zod: 4.6.7
