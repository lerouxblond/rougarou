# Hooks Git (`docs/09` §Git).
#
# Installes par le postinstall de lefthook. Pour les resynchroniser a la main :
# `pnpm exec lefthook install`.

pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: '*.{ts,tsx,js,mjs,json,jsonc,css,yaml,yml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    - name: eslint
      glob: '*.{ts,tsx,js,mjs}'
      run: pnpm exec eslint --fix --max-warnings=0 --no-warn-ignored {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: typecheck
      run: pnpm run typecheck
