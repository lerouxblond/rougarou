name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une seule execution par branche : un nouveau push annule la precedente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # docs/05 interdit les traceurs tiers.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  quality:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    # Quelques minutes d'ordinaire : au-dela, le job est bloque, on le coupe.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run typecheck

      # Le build precede les tests : le test des artefacts de la PWA relit
      # `apps/web/dist`, et Playwright sert ce meme build.
      - run: pnpm run build

      - run: pnpm run test

      - name: Budget de taille du bundle (docs/08)
        run: pnpm run size

      - name: Catalogue Ladle
        run: pnpm --filter @rougarou/ui run ladle:build

  e2e:
    name: Bout en bout
    runs-on: ubuntu-latest
    # Deux minutes d'ordinaire. Un miroir Ubuntu lent a deja bloque l'installation
    # des dependances systeme pendant plus de 45 minutes : on coupe a 20.
    timeout-minutes: 20
    env:
      # Sur une PR, Chromium seul ; WebKit (mobile) tourne sur `main`. La plupart des
      # paquets systeme a installer sont ceux de WebKit.
      BROWSERS: ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium webkit' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache des navigateurs Playwright
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.BROWSERS }}-${{ hashFiles('pnpm-lock.yaml') }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps $BROWSERS

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps $BROWSERS

      # Playwright sert `apps/web/dist` a travers `wrangler dev`.
      - run: pnpm run build

      - name: Tests de bout en bout
        run: pnpm run test:e2e ${{ github.event_name == 'pull_request' && '--project=chromium' || '' }}

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
